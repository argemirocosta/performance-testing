name: k6-performance-testing

services:
  serverest:
    image: paulogoncalvesbh/serverest:3.2.2
    container_name: serverest
    ports:
      - "3000:3000"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      # Allows k6 to push metrics via the experimental-prometheus-rw output
      - --web.enable-remote-write-receiver
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.5
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      # Local use only: allows viewing dashboards without logging in
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/k6-prometheus-native-histograms.json
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  # On-demand service (not started by `docker compose up`):
  #   docker compose run --rm k6 run smoke.ts
  k6:
    image: grafana/k6:2.3.0
    container_name: k6
    profiles: ["k6"]
    working_dir: /scripts
    environment:
      - BASE_URL=http://serverest:3000
      - K6_OUT=experimental-prometheus-rw
      - K6_PROMETHEUS_RW_SERVER_URL=http://prometheus:9090/api/v1/write
      - K6_FEATURES=native-histograms
      # Optional test settings, passed through from the host when set
      - VUS
      - DURATION
      - STEP_DURATION
      - SPIKE_VUS
    volumes:
      - ./tests:/scripts:ro
      - ./reports:/reports
    depends_on:
      - serverest
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
