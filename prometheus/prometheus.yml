global:
  scrape_interval: 15s
  evaluation_interval: 15s

# k6 metrics are pushed through remote write (/api/v1/write), so k6 has no
# scrape job. JMeter exposes /metrics (Prometheus plugin) and is scraped.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Only reachable while a test is running; the targets are down otherwise.
  - job_name: jmeter
    scrape_interval: 5s
    static_configs:
      - targets: ["jmeter:9270"]
        labels:
          runner: docker
      - targets: ["host.docker.internal:9270"]
        labels:
          runner: local
