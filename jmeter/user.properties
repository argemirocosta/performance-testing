# Loaded with `jmeter -q jmeter/user.properties` (local and docker runs).

# Prometheus plugin: bind to all interfaces so Prometheus can scrape it from
# its container, and keep /metrics up a few seconds after the test ends so the
# last values are collected (scrape interval is 5s).
prometheus.ip=0.0.0.0
prometheus.port=9270
prometheus.delay=10
prometheus.save.jvm=false

# Results file (.jtl) settings needed by the HTML report
jmeter.save.saveservice.output_format=csv
jmeter.save.saveservice.timestamp_format=ms
